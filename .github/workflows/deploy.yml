name: Deploy to Production

on:
  push:
    branches: [master]
  workflow_dispatch: {}

# Выкладки идут по очереди и не прерывают друг друга.
concurrency:
  group: deploy-studio
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Build frontend
        env:
          VITE_YANDEX_MAPS_KEY: ${{ secrets.VITE_YANDEX_MAPS_KEY }}
        run: |
          npm ci
          npm run build

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          script: |
            cd ${{ secrets.SSH_PATH }}
            git pull --ff-only origin master
            composer install --no-dev --optimize-autoloader --no-interaction
            php artisan migrate --force
            php artisan config:cache
            php artisan route:cache
            php artisan view:cache
            php artisan storage:link

      - name: Upload built assets
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          source: public/build
          target: ${{ secrets.SSH_PATH }}

      - name: Fix ownership
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          script: |
            cd ${{ secrets.SSH_PATH }}
            chown -R "$(stat -c %U:%G .)" .

      # Сайт должен отвечать после выкладки: иначе деплой краснеет сразу, а не через жалобу посетителя.
      - name: Smoke check
        run: |
          for path in / /api/hero /notebook; do
            ok=0
            for i in $(seq 1 10); do
              code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 15 "https://studio.plusuy.pro$path" || true)
              if [ "$code" = "200" ]; then ok=1; break; fi
              sleep 3
            done
            [ "$ok" = "1" ] || { echo "::error::studio.plusuy.pro$path ответил $code вместо 200"; exit 1; }
            echo "studio.plusuy.pro$path: 200"
          done
